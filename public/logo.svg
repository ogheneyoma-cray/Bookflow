<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark warm background -->
  <rect width="100" height="100" rx="8" fill="#1C1007"/>
  <!-- Crystal gem body -->
  <polygon points="50,10 83,40 50,92 17,40" fill="#C9A84C"/>
  <!-- Upper facet highlight -->
  <polygon points="50,10 68,32 50,40 32,32" fill="#E8D08A"/>
  <!-- Right facet shadow -->
  <polygon points="83,40 50,92 50,40" fill="#A87D30"/>
  <!-- Inner sparkle -->
  <polygon points="50,22 56,34 50,40 44,34" fill="white" opacity="0.35"/>
  <!-- Horizontal belt line -->
  <line x1="17" y1="40" x2="83" y2="40" stroke="#1C1007" stroke-width="0.8" opacity="0.4"/>
</svg>
